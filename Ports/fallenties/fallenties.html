<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Fallen Ties</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #fcfcf7;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/fallenties/index.icon.png" />
		<link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/fallenties/index.apple-touch-icon.png"/>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/fallenties/index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
const CDN_BASE = "https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/fallenties/";

const GODOT_CONFIG = {
	"args": [],
	"canvasResizePolicy": 2,
	"emscriptenPoolSize": 8,
	"ensureCrossOriginIsolationHeaders": true,
	"executable": "index",
	"experimentalVK": false,
	"fileSizes": {"index.pck": 28413104, "index.wasm": 35749181},
	"focusCanvas": true,
	"gdextensionLibs": [],
	"godotPoolSize": 4
};
const GODOT_THREADS_ENABLED = false;

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	function loadScript(src) {
		return new Promise((resolve, reject) => {
			const script = document.createElement('script');
			script.src = src;
			script.onload = resolve;
			script.onerror = () => reject(new Error(`Failed to load engine script: ${src}`));
			document.head.appendChild(script);
		});
	}

	const originalFetch = window.fetch;

	async function fetchAndMerge(urls) {
		const buffers = [];
		for (let i = 0; i < urls.length; i++) {
			const res = await originalFetch(urls[i]);
			if (!res.ok) throw new Error(`Failed to load ${urls[i]}: ${res.statusText}`);
			const buffer = await res.arrayBuffer();
			buffers.push(buffer);
		}
		return new Blob(buffers);
	}

	async function fetchAsDataUrl(url) {
		const res = await originalFetch(url);
		if (!res.ok) throw new Error(`Failed to load worklet script: ${url}`);
		const text = await res.text();
		return 'data:text/javascript;base64,' + btoa(text);
	}

	setStatusMode('progress');

	loadScript(CDN_BASE + 'index.js').then(() => {
		const missing = Engine.getMissingFeatures({
			threads: GODOT_THREADS_ENABLED,
		});

		if (missing.length !== 0) {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
			return;
		}

		return Promise.all([
			fetchAndMerge([CDN_BASE + 'index.pck.part1', CDN_BASE + 'index.pck.part2']),
			fetchAndMerge([CDN_BASE + 'index.wasm.part1', CDN_BASE + 'index.wasm.part2']),
			fetchAsDataUrl(CDN_BASE + 'index.audio.worklet.js'),
			fetchAsDataUrl(CDN_BASE + 'index.audio.position.worklet.js')
		]).then(([pckBlob, wasmBlob, workletDataUrl, posWorkletDataUrl]) => {
			window.fetch = function (resource, options) {
				const url = typeof resource === 'string' ? resource : resource.url;
				
				if (url.endsWith('index.wasm')) {
					return Promise.resolve(new Response(wasmBlob, {
						status: 200,
						headers: { 'Content-Type': 'application/wasm' }
					}));
				}
				if (url.endsWith('index.pck')) {
					return Promise.resolve(new Response(pckBlob, {
						status: 200,
						headers: { 'Content-Type': 'application/octet-stream' }
					}));
				}

				if (typeof resource === 'string' && !resource.startsWith('http') && !resource.startsWith('data:')) {
					return originalFetch(CDN_BASE + resource, options);
				}
				return originalFetch(resource, options);
			};

			if (window.AudioWorklet && AudioWorklet.prototype.addModule) {
				const originalAddModule = AudioWorklet.prototype.addModule;
				AudioWorklet.prototype.addModule = function (moduleURL, options) {
					if (typeof moduleURL === 'string') {
						if (moduleURL.includes('index.audio.position.worklet.js')) {
							moduleURL = posWorkletDataUrl;
						} else if (moduleURL.includes('index.audio.worklet.js')) {
							moduleURL = workletDataUrl;
						} else if (!moduleURL.startsWith('http') && !moduleURL.startsWith('data:')) {
							moduleURL = CDN_BASE + moduleURL;
						}
					}
					return originalAddModule.call(this, moduleURL, options);
				};
			}

			const engine = new Engine(GODOT_CONFIG);

			return engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					}
				},
			});
		}).then(() => {
			setStatusMode('hidden');
		});
	}).catch(displayFailureNotice);
}());
		</script>
	</body>
</html>
