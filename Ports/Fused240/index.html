<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
        <title>Fused 240</title>
        <style>
html, body, #canvas {
    margin: 0;
    padding: 0;
    border: 0;
}

body {
    color: white;
    background-color: black;
    overflow: hidden;
    touch-action: none;
}

#canvas {
    display: block;
}

#canvas:focus {
    outline: none;
}

#status, #status-splash, #status-progress {
    position: absolute;
    left: 0;
    right: 0;
}

#status, #status-splash {
    top: 0;
    bottom: 0;
}

#status {
    background-color: #000000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    visibility: hidden;
}

#status-splash {
    max-height: 100%;
    max-width: 100%;
    margin: auto;
}

#status-splash.show-image--false {
    display: none;
}

#status-splash.fullsize--true {
    height: 100%;
    width: 100%;
    object-fit: contain;
}

#status-splash.use-filter--false {
    image-rendering: pixelated;
}

#status-progress, #status-notice {
    display: none;
}

#status-progress {
    bottom: 10%;
    width: 50%;
    margin: 0 auto;
}

#status-notice {
    background-color: #5b3943;
    border-radius: 0.5rem;
    border: 1px solid #9b3943;
    color: #e0e0e0;
    font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
    line-height: 1.3;
    margin: 0 2rem;
    overflow: hidden;
    padding: 1rem;
    text-align: center;
    z-index: 1;
}
        </style>
        <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
        <link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
    </head>
    <body>
        <canvas id="canvas">
            Your browser does not support the canvas tag.
        </canvas>

        <noscript>
            Your browser does not support JavaScript.
        </noscript>

        <div id="status">
            <img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
            <progress id="status-progress"></progress>
            <div id="status-notice"></div>
        </div>

        <script src="index.js"></script>
        <script>
const GODOT_CONFIG = {
    "args": [],
    "canvasResizePolicy": 2,
    "ensureCrossOriginIsolationHeaders": false,
    "executable": "index",
    "experimentalVK": false,
    "fileSizes": { "index.pck": 235278672, "index.wasm": 52126319 },
    "focusCanvas": true,
    "gdextensionLibs": []
};
const GODOT_THREADS_ENABLED = false;

// Base CDN URL pointing directly to where the split files reside
const BASE_CDN_URL = 'https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/Fused240/';

async function fetchAndMergeBuffer(baseName, totalParts, useZeroPadding = false) {
    const chunks = [];
    for (let i = 1; i <= totalParts; i++) {
        const partNumber = (useZeroPadding && i < 10) ? `0${i}` : `${i}`;
        const partName = `${BASE_CDN_URL}${baseName}.part${partNumber}`;

        const response = await fetch(partName);
        if (!response.ok) {
            throw new Error(`Failed to download ${partName} (HTTP ${response.status})`);
        }
        chunks.push(await response.arrayBuffer());
    }

    const totalLength = chunks.reduce((acc, chunk) => acc + chunk.byteLength, 0);
    const combined = new Uint8Array(totalLength);
    let offset = 0;
    for (const chunk of chunks) {
        combined.set(new Uint8Array(chunk), offset);
        offset += chunk.byteLength;
    }
    return combined.buffer;
}

(async function () {
    const statusOverlay = document.getElementById('status');
    const statusProgress = document.getElementById('status-progress');
    const statusNotice = document.getElementById('status-notice');

    let initializing = true;
    let statusMode = '';

    function setStatusMode(mode) {
        if (statusMode === mode || !initializing) return;
        if (mode === 'hidden') {
            statusOverlay.remove();
            initializing = false;
            return;
        }
        statusOverlay.style.visibility = 'visible';
        statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
        statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
        statusMode = mode;
    }

    function setStatusNotice(text) {
        while (statusNotice.lastChild) {
            statusNotice.removeChild(statusNotice.lastChild);
        }
        text.split('\n').forEach((line) => {
            statusNotice.appendChild(document.createTextNode(line));
            statusNotice.appendChild(document.createElement('br'));
        });
    }

    function displayFailureNotice(err) {
        console.error(err);
        setStatusNotice(err instanceof Error ? err.message : String(err));
        setStatusMode('notice');
        initializing = false;
    }

    try {
        setStatusMode('progress');

        const [wasmBuffer, pckBuffer] = await Promise.all([
            fetchAndMergeBuffer('index.wasm', 3, false),
            fetchAndMergeBuffer('index.pck', 13, true)
        ]);

        const wasmModule = await WebAssembly.compile(wasmBuffer);

        const pckBlob = new Blob([pckBuffer], { type: 'application/octet-stream' });
        GODOT_CONFIG.mainPack = URL.createObjectURL(pckBlob);

        // Override internal engine fetch method to bypass index.wasm network calls
        const originalFetch = window.fetch;
        window.fetch = function (resource, init) {
            if (typeof resource === 'string' && resource.includes('index.wasm')) {
                return Promise.resolve(new Response(wasmBuffer, {
                    headers: { 'Content-Type': 'application/wasm' }
                }));
            }
            return originalFetch.apply(this, arguments);
        };

        const engine = new Engine(GODOT_CONFIG);

        await engine.startGame({
            'wasmModule': wasmModule,
            'onProgress': function (current, total) {
                if (current > 0 && total > 0) {
                    statusProgress.value = current;
                    statusProgress.max = total;
                } else {
                    statusProgress.removeAttribute('value');
                    statusProgress.removeAttribute('max');
                }
            },
        });

        // Restore default fetch behavior after game start
        window.fetch = originalFetch;

        setStatusMode('hidden');
    } catch (err) {
        displayFailureNotice(err);
    }
}());
        </script>
    </body>
</html>
