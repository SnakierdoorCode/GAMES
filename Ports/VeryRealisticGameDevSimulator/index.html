<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
        <title>Very Realistic Game Dev Simulator</title>
        <style>
html, body, #canvas {
    margin: 0;
    padding: 0;
    border: 0;
}

body {
    color: white;
    background-color: black;
    overflow: hidden;
    touch-action: none;
}

#canvas {
    display: block;
}

#canvas:focus {
    outline: none;
}

#status, #status-splash, #status-progress {
    position: absolute;
    left: 0;
    right: 0;
}

#status, #status-splash {
    top: 0;
    bottom: 0;
}

#status {
    background-color: #000000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    visibility: hidden;
}

#status-splash {
    max-height: 100%;
    max-width: 100%;
    margin: auto;
}

#status-splash.show-image--false {
    display: none;
}

#status-splash.fullsize--true {
    height: 100%;
    width: 100%;
    object-fit: contain;
}

#status-splash.use-filter--false {
    image-rendering: pixelated;
}

#status-progress, #status-notice {
    display: none;
}

#status-progress {
    bottom: 10%;
    width: 50%;
    margin: 0 auto;
}

#status-notice {
    background-color: #5b3943;
    border-radius: 0.5rem;
    border: 1px solid #9b3943;
    color: #e0e0e0;
    font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
    line-height: 1.3;
    margin: 0 2rem;
    overflow: hidden;
    padding: 1rem;
    text-align: center;
    z-index: 1;
}
        </style>
        <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

    </head>
    <body>
        <canvas id="canvas">
            Your browser does not support the canvas tag.
        </canvas>

        <noscript>
            Your browser does not support JavaScript.
        </noscript>

        <div id="status">
            <img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
            <progress id="status-progress"></progress>
            <div id="status-notice"></div>
        </div>

        <!-- Fetch Interceptor Setup BEFORE index.js loads -->
        <script>
            window.virtualFileCache = {};

            const originalFetch = window.fetch;
            window.fetch = async function(resource, init) {
                let url = typeof resource === 'string' ? resource : (resource instanceof Request ? resource.url : String(resource));
                
                // Check if Godot is requesting the files we split
                for (let filename in window.virtualFileCache) {
                    if (url.endsWith('/' + filename) || url === filename) {
                        console.log(`[Interceptor] Serving ${filename} from merged memory parts.`);
                        return new Response(window.virtualFileCache[filename], {
                            status: 200,
                            statusText: 'OK',
                            headers: { 'Content-Type': filename.endsWith('.wasm') ? 'application/wasm' : 'application/octet-stream' }
                        });
                    }
                }
                return originalFetch(resource, init);
            };
        </script>

        <script src="index.js"></script>
        <script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":744486176,"index.wasm":52126319},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
    const statusOverlay = document.getElementById('status');
    const statusProgress = document.getElementById('status-progress');
    const statusNotice = document.getElementById('status-notice');
    const canvas = document.getElementById('canvas');

    // Add Mouse / Pointer Lock functionality
    canvas.addEventListener('click', () => {
        if (document.pointerLockElement !== canvas) {
            canvas.requestPointerLock();
        }
    });

    let initializing = true;
    let statusMode = '';

    function setStatusMode(mode) {
        if (statusMode === mode || !initializing) {
            return;
        }
        if (mode === 'hidden') {
            statusOverlay.remove();
            initializing = false;
            return;
        }
        statusOverlay.style.visibility = 'visible';
        statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
        statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
        statusMode = mode;
    }

    function setStatusNotice(text) {
        while (statusNotice.lastChild) {
            statusNotice.removeChild(statusNotice.lastChild);
        }
        const lines = text.split('\n');
        lines.forEach((line) => {
            statusNotice.appendChild(document.createTextNode(line));
            statusNotice.appendChild(document.createElement('br'));
        });
    }

    function displayFailureNotice(err) {
        console.error(err);
        if (err instanceof Error) {
            setStatusNotice(err.message);
        } else if (typeof err === 'string') {
            setStatusNotice(err);
        } else {
            setStatusNotice('An unknown error occurred.');
        }
        setStatusMode('notice');
        initializing = false;
    }

    // Helper to fetch and merge split file parts
    async function fetchAndMergeParts(baseUrl, totalParts, paddingLength = 0) {
        let buffers = [];
        let totalLength = 0;

        for (let i = 1; i <= totalParts; i++) {
            let partNum = paddingLength > 0 ? String(i).padStart(paddingLength, '0') : i;
            let partUrl = `${baseUrl}.part${partNum}`;
            
            setStatusNotice(`Downloading ${baseUrl} (Part ${i}/${totalParts})...`);
            
            let response = await fetch(partUrl);
            if (!response.ok) {
                throw new Error(`Failed to load ${partUrl}`);
            }
            let buffer = await response.arrayBuffer();
            buffers.push(buffer);
            totalLength += buffer.byteLength;
        }

        let mergedBuffer = new Uint8Array(totalLength);
        let offset = 0;
        for (let buffer of buffers) {
            mergedBuffer.set(new Uint8Array(buffer), offset);
            offset += buffer.byteLength;
        }

        return mergedBuffer;
    }

    const missing = Engine.getMissingFeatures({
        threads: GODOT_THREADS_ENABLED,
    });

    if (missing.length !== 0) {
        const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
        displayFailureNotice(missingMsg + missing.join('\n'));
    } else {
        setStatusMode('progress');
        
        async function loadAndStartGame() {
            try {
                setStatusNotice('Preparing game files...');
                
                // 1. Fetch and merge WASM parts (index.wasm.part1 to part3)
                const wasmBytes = await fetchAndMergeParts('index.wasm', 3, 0);
                
                // 2. Fetch and merge PCK parts (index.pck.part01 to part40)
                const pckBytes = await fetchAndMergeParts('index.pck', 40, 2);

                setStatusNotice('Starting engine...');

                // Place merged blobs into the interceptor cache instead of requesting them over network
                window.virtualFileCache['index.wasm'] = new Blob([wasmBytes]);
                window.virtualFileCache['index.pck'] = new Blob([pckBytes]);

                await engine.startGame({
                    'onProgress': function (current, total) {
                        if (current > 0 && total > 0) {
                            statusProgress.value = current;
                            statusProgress.max = total;
                        } else {
                            statusProgress.removeAttribute('value');
                            statusProgress.removeAttribute('max');
                        }
                    },
                });
                setStatusMode('hidden');
            } catch (err) {
                displayFailureNotice(err);
            }
        }

        loadAndStartGame();
    }
}());
        </script>
    </body>
</html>
