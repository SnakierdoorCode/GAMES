        <script>
window.loadCustomVoicePack = function() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.zip';
    
    // Temporarily append to body so the browser treats it as a full document action
    input.style.display = 'none';
    document.body.appendChild(input);

    input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
            JSZip.loadAsync(event.target.result).then(async function(zip) {
                window.customPackFiles = {};
                for (let filename of Object.keys(zip.files)) {
                    let zipEntry = zip.files[filename];
                    if (!zipEntry.dir) {
                        let arrayBuffer = await zipEntry.async("arraybuffer");
                        window.customPackFiles[filename] = arrayBuffer;
                    }
                }
                window.customPackLoaded = true;
                window.customPackName = file.name;
                console.log("Loaded pack:", file.name);
            });
        };
        reader.readAsArrayBuffer(file);
        
        // Clean up the element after selection
        document.body.removeChild(input);
    };

    input.click();
};																						
        </script>
		<script>
(function () {
	const CHUNKED_ASSET_COUNTS = {
		'index.pck': 7,
		'index.wasm': 3,
	};
	const originalFetch = window.fetch.bind(window);

	async function mergeChunkedAsset(assetName, requestUrl) {
		const assetUrl = new URL(requestUrl, window.location.href);
		const totalParts = CHUNKED_ASSET_COUNTS[assetName];
		const chunkBuffers = [];
		for (let index = 0; index < totalParts; index += 1) {
			const chunkName = `${assetName}.${String(index).padStart(3, '0')}`;
			const chunkUrl = new URL(chunkName, assetUrl);
			const chunkResponse = await originalFetch(chunkUrl.href);
			if (!chunkResponse.ok) {
				throw new Error(`Failed loading chunk '${chunkName}'`);
			}
			chunkBuffers.push(new Uint8Array(await chunkResponse.arrayBuffer()));
		}

		const mergedLength = chunkBuffers.reduce((sum, chunk) => sum + chunk.length, 0);
		const mergedBytes = new Uint8Array(mergedLength);
		let offset = 0;
		for (const chunk of chunkBuffers) {
			mergedBytes.set(chunk, offset);
			offset += chunk.length;
		}

		const headers = {
			'Content-Type': assetName.endsWith('.wasm') ? 'application/wasm' : 'application/octet-stream',
			'Content-Length': String(mergedLength),
		};
		return new Response(mergedBytes.buffer, {
			status: 200,
			statusText: 'OK',
			headers,
		});
	}

	window.fetch = async function (input, init) {
		const requestUrl = typeof input === 'string' ? input : input instanceof Request ? input.url : input;
		if (!requestUrl || typeof requestUrl !== 'string') {
			return originalFetch(input, init);
		}
		const parsed = new URL(requestUrl, window.location.href);
		const assetName = parsed.pathname.split('/').pop();
		if (assetName in CHUNKED_ASSET_COUNTS) {
			return mergeChunkedAsset(assetName, requestUrl);
		}
		return originalFetch(input, init);
	};
}());

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":113736432,"index.wasm":52126319},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
