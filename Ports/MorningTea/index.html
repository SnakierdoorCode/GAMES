<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>the morning tea</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/MorningTea/index.icon.png" />
		<link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/MorningTea/the%20morning%20tea.apple-touch-icon.png"/>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--false use-filter--false" src="https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/MorningTea/the%20morning%20tea.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/MorningTea/the%20morning%20tea.js"></script>
		<script>
const CDN_BASE = "https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/MorningTea/";
const PCK_NAME = "the morning tea.pck";

async function fetchAndMergeWasm() {
	const [p1, p2] = await Promise.all([
		fetch("https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/MorningTea/the%20morning%20tea.wasm.part1").then(r => {
			if (!r.ok) throw new Error(`Failed WASM Part 1 (${r.status})`);
			return r.arrayBuffer();
		}),
		fetch("https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/MorningTea/the%20morning%20tea.wasm.part2").then(r => {
			if (!r.ok) throw new Error(`Failed WASM Part 2 (${r.status})`);
			return r.arrayBuffer();
		})
	]);
	const buf = new Uint8Array(p1.byteLength + p2.byteLength);
	buf.set(new Uint8Array(p1), 0);
	buf.set(new Uint8Array(p2), p1.byteLength);
	return buf.buffer;
}

async function fetchAndMergePck() {
	const [p1, p2] = await Promise.all([
		fetch("https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/MorningTea/the%20morning%20tea.pck.part1").then(r => {
			if (!r.ok) throw new Error(`Failed PCK Part 1 (${r.status})`);
			return r.arrayBuffer();
		}),
		fetch("https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/MorningTea/the%20morning%20tea.pck.part2").then(r => {
			if (!r.ok) throw new Error(`Failed PCK Part 2 (${r.status})`);
			return r.arrayBuffer();
		})
	]);
	const buf = new Uint8Array(p1.byteLength + p2.byteLength);
	buf.set(new Uint8Array(p1), 0);
	buf.set(new Uint8Array(p2), p1.byteLength);
	return buf.buffer;
}

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	async function bootGame() {
		setStatusMode('progress');
		try {

			const [wasmBuffer, pckBuffer] = await Promise.all([
				fetchAndMergeWasm(),
				fetchAndMergePck()
			]);

			const originalFetch = window.fetch;
			window.fetch = function (input, init) {
				const url = typeof input === 'string' ? input : (input && input.url);
				if (url && url.endsWith('.wasm')) {
					return Promise.resolve(new Response(wasmBuffer.slice(0), {
						status: 200,
						headers: { 'Content-Type': 'application/wasm' }
					}));
				}
				return originalFetch(input, init);
			};

			const GODOT_CONFIG = {
				"args": ["--main-pack", PCK_NAME],
				"canvasResizePolicy":2,
				"emscriptenPoolSize":8,
				"ensureCrossOriginIsolationHeaders":false,
				"executable": CDN_BASE + "the%20morning%20tea",
				"mainPack": PCK_NAME,
				"experimentalVK":false,
				"gdextensionLibs":[],
				"godotPoolSize":4
			};

			const engine = new Engine(GODOT_CONFIG);

			await engine.init(CDN_BASE + "the%20morning%20tea");

			await engine.preloadFile(new Uint8Array(pckBuffer), PCK_NAME);

			await engine.start({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			});

			window.fetch = originalFetch;

			setStatusMode('hidden');
		} catch (err) {
			displayFailureNotice(err);
		}
	}

	bootGame();
}());
		</script>
	</body>
</html>
