<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='' xml:lang=''>
<head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' />
    <title>ABaF</title>
    <style type='text/css'>

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            margin: 0;
            border: 0 none;
            padding: 0;
            text-align: center;
            background-color: black;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
            margin: 0;
            color: white;
        }

        #canvas:focus {
            outline: none;
        }

        .godot {
            font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
            color: #e0e0e0;
            background-color: #3b3943;
            background-image: linear-gradient(to bottom, #403e48, #35333c);
            border: 1px solid #45434e;
            box-shadow: 0 0 1px 1px #2f2d35;
        }

        /* Status display
         * ============== */

        #status {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            /* don't consume click events - make children visible explicitly */
            visibility: hidden;
            z-index: 10;
        }

        #status-progress {
            width: 366px;
            height: 7px;
            background-color: #38363A;
            border: 1px solid #444246;
            padding: 1px;
            box-shadow: 0 0 2px 1px #1B1C22;
            border-radius: 2px;
            visibility: visible;
        }

        @media only screen and (orientation:portrait) {
            #status-progress {
                width: 61.8%;
            }
        }

        #status-progress-inner {
            height: 100%;
            width: 0;
            box-sizing: border-box;
            transition: width 0.5s linear;
            background-color: #202020;
            border: 1px solid #222223;
            box-shadow: 0 0 1px 1px #27282E;
            border-radius: 3px;
        }

        #status-indeterminate {
            height: 42px;
            visibility: visible;
            position: relative;
        }

        #status-indeterminate > div {
            width: 4.5px;
            height: 0;
            border-style: solid;
            border-width: 9px 3px 0 3px;
            border-color: #2b2b2b transparent transparent transparent;
            transform-origin: center 21px;
            position: absolute;
        }

        #status-indeterminate > div:nth-child(1) { transform: rotate( 22.5deg); }
        #status-indeterminate > div:nth-child(2) { transform: rotate( 67.5deg); }
        #status-indeterminate > div:nth-child(3) { transform: rotate(112.5deg); }
        #status-indeterminate > div:nth-child(4) { transform: rotate(157.5deg); }
        #status-indeterminate > div:nth-child(5) { transform: rotate(202.5deg); }
        #status-indeterminate > div:nth-child(6) { transform: rotate(247.5deg); }
        #status-indeterminate > div:nth-child(7) { transform: rotate(292.5deg); }
        #status-indeterminate > div:nth-child(8) { transform: rotate(337.5deg); }

        #status-notice {
            margin: 0 100px;
            line-height: 1.3;
            visibility: visible;
            padding: 4px 6px;
        }
    </style>
<link id='-gd-engine-icon' rel='icon' type='image/png' href='https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/ABiteAtFreddys/index.icon.png' />
<link rel='apple-touch-icon' href='https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/ABiteAtFreddys/index.apple-touch-icon.png'/>

</head>
<body>
    <canvas id='canvas'>
        HTML5 canvas appears to be unsupported in the current browser.<br />
        Please try updating or use a different browser.
    </canvas>
    <div id='status'>
        <div id='status-progress' style='display: none;' oncontextmenu='event.preventDefault();'><div id ='status-progress-inner'></div></div>
        <div id='status-indeterminate' style='display: none;' oncontextmenu='event.preventDefault();'>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div id='status-notice' class='godot' style='display: none;'></div>
    </div>

    <script type='text/javascript'>//<![CDATA[

        const CDN_BASE = 'https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/Ports/ABiteAtFreddys/';
        const originalFetch = window.fetch;
        const originalXHR = window.XMLHttpRequest.prototype.open;

        const TOTAL_PCK_SIZE = 330997728;
        const GODOT_CONFIG = {
            "args": [],
            "canvasResizePolicy": 1,
            "executable": CDN_BASE + "index",
            "experimentalVK": false,
            "fileSizes": {
                "index.pck": TOTAL_PCK_SIZE,
                "index.wasm": 17860295
            },
            "focusCanvas": true,
            "gdnativeLibs": []
        };

        // Intercept XMLHttpRequest calls made by Emscripten
        window.XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
            let targetUrl = url;
            if (typeof targetUrl === 'string' && !targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                targetUrl = CDN_BASE + targetUrl;
            }
            return originalXHR.call(this, method, targetUrl, async, user, password);
        };

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = () => reject(new Error(`Failed to load script ${src}`));
                document.head.appendChild(s);
            });
        }

        (function() {
            const INDETERMINATE_STATUS_STEP_MS = 100;
            var statusProgress = document.getElementById('status-progress');
            var statusProgressInner = document.getElementById('status-progress-inner');
            var statusIndeterminate = document.getElementById('status-indeterminate');
            var statusNotice = document.getElementById('status-notice');

            var initializing = true;
            var statusMode = 'hidden';

            var animationCallbacks = [];
            function animate(time) {
                animationCallbacks.forEach(callback => callback(time));
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);

            function setStatusMode(mode) {
                if (statusMode === mode || !initializing)
                    return;
                [statusProgress, statusIndeterminate, statusNotice].forEach(elem => {
                    elem.style.display = 'none';
                });
                animationCallbacks = animationCallbacks.filter(function(value) {
                    return (value != animateStatusIndeterminate);
                });
                switch (mode) {
                    case 'progress':
                        statusProgress.style.display = 'block';
                        break;
                    case 'indeterminate':
                        statusIndeterminate.style.display = 'block';
                        animationCallbacks.push(animateStatusIndeterminate);
                        break;
                    case 'notice':
                        statusNotice.style.display = 'block';
                        break;
                    case 'hidden':
                        break;
                    default:
                        throw new Error('Invalid status mode');
                }
                statusMode = mode;
            }

            function animateStatusIndeterminate(ms) {
                var i = Math.floor(ms / INDETERMINATE_STATUS_STEP_MS % 8);
                if (statusIndeterminate.children[i].style.borderTopColor == '') {
                    Array.prototype.slice.call(statusIndeterminate.children).forEach(child => {
                        child.style.borderTopColor = '';
                    });
                    statusIndeterminate.children[i].style.borderTopColor = '#dfdfdf';
                }
            }

            function setStatusNotice(text) {
                while (statusNotice.lastChild) {
                    statusNotice.removeChild(statusNotice.lastChild);
                }
                var lines = text.split('\n');
                lines.forEach((line) => {
                    statusNotice.appendChild(document.createTextNode(line));
                    statusNotice.appendChild(document.createElement('br'));
                });
            };

            function displayFailureNotice(err) {
                var msg = err.message || err;
                console.error(msg);
                setStatusNotice(String(msg));
                setStatusMode('notice');
                initializing = false;
            };

            async function fetchAndCombinePckParts(partCount) {
                const chunks = [];
                let loadedBytes = 0;

                for (let i = 1; i <= partCount; i++) {
                    const partNum = String(i).padStart(2, '0');
                    const fileUrl = `${CDN_BASE}index.pck.part${partNum}`;

                    const response = await originalFetch(fileUrl);
                    if (!response.ok) {
                        throw new Error(`Failed to load part ${partNum} (${response.statusText})`);
                    }
                    const buffer = await response.arrayBuffer();
                    chunks.push(buffer);
                    loadedBytes += buffer.byteLength;

                    if (TOTAL_PCK_SIZE > 0) {
                        statusProgressInner.style.width = (loadedBytes / TOTAL_PCK_SIZE) * 100 + '%';
                        setStatusMode('progress');
                    }
                }

                const combinedBlob = new Blob(chunks, { type: 'application/octet-stream' });
                return await combinedBlob.arrayBuffer();
            }

            function isWebGLAvailable() {
                try {
                    const testCanvas = document.createElement('canvas');
                    return !!(window.WebGLRenderingContext && 
                        (testCanvas.getContext('webgl2') || 
                         testCanvas.getContext('webgl') || 
                         testCanvas.getContext('experimental-webgl')));
                } catch (e) {
                    return false;
                }
            }

            if (!isWebGLAvailable()) {
                displayFailureNotice('WebGL not available');
            } else {
                setStatusMode('indeterminate');

                // Load index.js dynamically from CDN first
                loadScript(CDN_BASE + 'index.js').then(() => {
                    return fetchAndCombinePckParts(18);
                }).then(pckArrayBuffer => {
                    // Intercept fetch requests
                    window.fetch = function(url, options) {
                        const urlString = typeof url === 'string' ? url : (url.url || String(url));

                        if (urlString.includes('index.pck')) {
                            return Promise.resolve(new Response(pckArrayBuffer.slice(0), {
                                status: 200,
                                headers: { 
                                    'Content-Type': 'application/octet-stream',
                                    'Content-Length': pckArrayBuffer.byteLength.toString()
                                }
                            }));
                        }

                        if (!urlString.startsWith('http://') && !urlString.startsWith('https://')) {
                            return originalFetch(CDN_BASE + urlString, options);
                        }

                        return originalFetch(url, options);
                    };

                    var engine = new Engine(GODOT_CONFIG);

                    return engine.startGame({
                        'onProgress': function (current, total) {
                            if (total > 0) {
                                statusProgressInner.style.width = (current / total) * 100 + '%';
                                setStatusMode('progress');
                                if (current === total) {
                                    setTimeout(() => {
                                        setStatusMode('indeterminate');
                                    }, 500);
                                }
                            } else {
                                setStatusMode('indeterminate');
                            }
                        }
                    });
                }).then(() => {
                    setStatusMode('hidden');
                    initializing = false;
                }).catch(displayFailureNotice);
            }
        })();
    //]]></script>
</body>
</html>
