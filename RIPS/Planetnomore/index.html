<!DOCTYPE html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Planet No More</title>
	<style>
		html,
		body {
			background: #0b0924;
			width: 100%;
			height: 100%;
			overflow: visible;
			padding: 0;
			margin: 0;
		}

		div#gameContainer {
			background: transparent !important;
			position: absolute;
		}

		div#gameContainer canvas {
			position: absolute;
		}

		div#gameContainer canvas[data-pixel-art="true"] {
			position: absolute;
			image-rendering: optimizeSpeed;
			image-rendering: -webkit-crisp-edges;
			image-rendering: -moz-crisp-edges;
			image-rendering: -o-crisp-edges;
			image-rendering: crisp-edges;
			image-rendering: -webkit-optimize-contrast;
			image-rendering: optimize-contrast;
			image-rendering: pixelated;
			-ms-interpolation-mode: nearest-neighbor;
		}
	</style>
</head>

<body>
	<div id="gameContainer">
		<canvas id="unity-canvas" width="1280" height="720" data-pixel-art="true"></canvas>
		<script src="https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/Planetnomore/Build/planetmonoreweb.loader.js"></script>
		<script>
			var canvas = document.querySelector("#unity-canvas");
			// The wasm binary was split into parts in the Build folder.
			// It has been merged into Build/planetmonoreweb.wasm.br for the loader.
			var config = {
				dataUrl: "https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/Planetnomore/Build/planetmonoreweb.data.br",
				frameworkUrl: "https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/Planetnomore/Build/planetmonoreweb.framework.js.br",
				codeUrl: "https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/Planetnomore/Build/planetmonoreweb.wasm.br",
				streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/Planetnomore/StreamingAssets",
				companyName: "WiseMonkeES",
				productName: "Planet No More",
				productVersion: "Demo.0.8",
			};
			var scaleToFit;
			try {
				scaleToFit = !!JSON.parse("true");
			} catch (e) {
				scaleToFit = true;
			}
			function progressHandler(progress) {
				var percent = progress * 100 + '%';
				canvas.style.background = 'linear-gradient(to right, white, white ' + percent + ', transparent ' + percent + ', transparent) no-repeat center';
				canvas.style.backgroundSize = '100% 1rem';
			}
			function onResize() {
				var container = canvas.parentElement;
				var w;
				var h;

				if (scaleToFit) {
					w = window.innerWidth;
					h = window.innerHeight;

					var r = 720 / 1280;

					if (w * r > window.innerHeight) {
						w = Math.min(w, Math.ceil(h / r));
					}
					h = Math.floor(w * r);
				} else {
					w = 1280;
					h = 720;
				}

				container.style.width = canvas.style.width = w + "px";
				container.style.height = canvas.style.height = h + "px";
				container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
				container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
			}
			createUnityInstance(canvas, config, progressHandler).then(function (instance) {
				canvas = instance.Module.canvas;
				onResize();
			});
			window.addEventListener('resize', onResize);
			onResize();

			if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
				
				const meta = document.createElement('meta');
				meta.name = 'viewport';
				meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
				document.getElementsByTagName('head')[0].appendChild(meta);
			}
		</script>
	</div>
</body>

</html>
