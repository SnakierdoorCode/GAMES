<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>ScreamJam</title>
    <script src="Build/UnityLoader.js"></script>
    <script>
        var gameInstance;

        async function loadGame() {
            var parts = [
                "Build/officeHoursWebGLfaster.data.unityweb.part1",
                "Build/officeHoursWebGLfaster.data.unityweb.part2"
            ];

            try {
                var responses = await Promise.all(parts.map(url => fetch(url).then(r => r.arrayBuffer())));
                var totalLength = responses.reduce((acc, buf) => acc + buf.byteLength, 0);

                var combinedBuffer = new Uint8Array(totalLength);
                var offset = 0;
                for (var buf of responses) {
                    combinedBuffer.set(new Uint8Array(buf), offset);
                    offset += buf.byteLength;
                }

                var blob = new Blob([combinedBuffer], { type: "application/octet-stream" });
                var dataUrl = URL.createObjectURL(blob);

                gameInstance = UnityLoader.instantiate("gameContainer", "Build/officeHoursWebGLfaster.json", {
                    Module: {
                        dataUrl: dataUrl
                    }
                });

                onResize();
            } catch (err) {
                console.error("Failed to load or merge split game data files:", err);
            }
        }

        function onResize() {
            var container = document.getElementById("gameContainer");
            if (!container) return;

            var windowWidth = window.innerWidth;
            var windowHeight = window.innerHeight;
            var targetAspect = 16 / 9;
            var windowAspect = windowWidth / windowHeight;

            var w, h;

            if (windowAspect > targetAspect) {
                // Window is wider than 16:9 -> fit to height
                h = windowHeight;
                w = h * targetAspect;
            } else {
                // Window is taller than 16:9 -> fit to width
                w = windowWidth;
                h = w / targetAspect;
            }

            container.style.width = Math.floor(w) + "px";
            container.style.height = Math.floor(h) + "px";

            // If canvas exists inside container, match its internal frame dimensions
            var canvas = container.querySelector("canvas");
            if (canvas) {
                canvas.style.width = Math.floor(w) + "px";
                canvas.style.height = Math.floor(h) + "px";
            }
        }

        window.addEventListener('resize', onResize);
    </script>
    <style>
        html,
        body {
            background: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #gameContainer canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        div#gameContainer[data-pixelated='true'] canvas {
            image-rendering: optimizeSpeed;
            image-rendering: -webkit-crisp-edges;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }
    </style>
</head>

<body onload="loadGame();">
    <div id="gameContainer" data-pixelated=""></div>
</body>

</html>
