<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>ScreamJam</title>

    <script>
        // Base CDN URL using jsDelivr to avoid CORS and MIME issues
        var BASE_CDN = "https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/OfficeHours/";

        function getCdnUrl(relativePath) {
            var cleanPath = relativePath.startsWith('/') ? relativePath.substring(1) : relativePath;
            return BASE_CDN + cleanPath;
        }

        // Dynamically load UnityLoader.js
        (function loadUnityLoader() {
            var script = document.createElement("script");
            script.src = getCdnUrl("Build/UnityLoader.js");
            script.onload = function () {
                loadGame();
            };
            script.onerror = function () {
                console.warn("jsDelivr failed. Trying raw GitHub CDN fallback...");
                var fallbackScript = document.createElement("script");
                fallbackScript.src = "https://raw.githubusercontent.com/SnakierdoorCode/GAMES/main/RIPS/OfficeHours/Build/UnityLoader.js";
                fallbackScript.onload = loadGame;
                fallbackScript.onerror = function () {
                    console.error("Failed to load UnityLoader.js from CDN.");
                };
                document.head.appendChild(fallbackScript);
            };
            document.head.appendChild(script);
        })();

        var gameInstance;

        async function loadGame() {
            var parts = [
                getCdnUrl("Build/officeHoursWebGLfaster.data.unityweb.part1"),
                getCdnUrl("Build/officeHoursWebGLfaster.data.unityweb.part2")
            ];

            try {
                // Fetch both parts in parallel
                var responses = await Promise.all(parts.map(function (url) {
                    return fetch(url).then(function (r) {
                        if (!r.ok) throw new Error("HTTP error " + r.status + " fetching " + url);
                        return r.arrayBuffer();
                    });
                }));

                // Calculate total size & stitch buffers together
                var totalLength = responses.reduce(function (acc, buf) { return acc + buf.byteLength; }, 0);
                var combinedBuffer = new Uint8Array(totalLength);
                var offset = 0;

                for (var i = 0; i < responses.length; i++) {
                    combinedBuffer.set(new Uint8Array(responses[i]), offset);
                    offset += responses[i].byteLength;
                }

                // Create blob URL for merged data
                var blob = new Blob([combinedBuffer], { type: "application/octet-stream" });
                var dataUrl = URL.createObjectURL(blob);
                var jsonUrl = getCdnUrl("Build/officeHoursWebGLfaster.json");

                // Initialize Unity with expanded memory limit and CDN asset router
                gameInstance = UnityLoader.instantiate("gameContainer", jsonUrl, {
                    Module: {
                        TOTAL_MEMORY: 268435456, // Allocates 256MB WebAssembly heap (Default is usually 128MB)
                        dataUrl: dataUrl,
                        locateFile: function (path) {
                            return getCdnUrl("Build/" + path);
                        }
                    }
                });

                onResize();
            } catch (err) {
                console.error("Failed to load or merge game files from CDN:", err);
            }
        }

        function onResize() {
            var container = document.getElementById("gameContainer");
            if (!container) return;

            var windowWidth = window.innerWidth;
            var windowHeight = window.innerHeight;
            var targetAspect = 16 / 9;
            var windowAspect = windowWidth / windowHeight;

            var w, h;

            if (windowAspect > targetAspect) {
                h = windowHeight;
                w = h * targetAspect;
            } else {
                w = windowWidth;
                h = w / targetAspect;
            }

            container.style.width = Math.floor(w) + "px";
            container.style.height = Math.floor(h) + "px";

            var canvas = container.querySelector("canvas");
            if (canvas) {
                canvas.style.width = Math.floor(w) + "px";
                canvas.style.height = Math.floor(h) + "px";
            }
        }

        window.addEventListener('resize', onResize);
    </script>
    <style>
        html,
        body {
            background: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #gameContainer canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        div#gameContainer[data-pixelated='true'] canvas {
            image-rendering: optimizeSpeed;
            image-rendering: -webkit-crisp-edges;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }
    </style>
</head>

<body>
    <div id="gameContainer" data-pixelated=""></div>
</body>

</html>
