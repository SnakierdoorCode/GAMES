<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base href="https://fastly.jsdelivr.net/gh/eazy-man/shHH@main/bshift/">
<title>Loading Half-Life Blue Shift</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
    color: #fff;
    overflow: hidden;
}

#loading-container {
    width: 60%;
    max-width: 600px;
    text-align: center;
}

#progress-bar {
    width: 100%;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
    height: 30px;
    margin-top: 10px;
    box-shadow: 0 0 10px #000 inset;
}

#progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6a11cb, #2575fc);
    transition: width 0.05s linear;
}

#progress-text {
    margin-top: 10px;
    font-size: 18px;
}

#status-text {
    margin-top: 6px;
    font-size: 13px;
    color: #aaa;
}

canvas {
    width: 100vw;
    height: 100vh;
    top: 0;
    left: 0;
    position: fixed;
    display: none;
}
</style>

<script src="./raw.js"></script>
<script src="./jszip.js"></script>
</head>

<body>

<div id="loading-container">
    <h1>Loading Half-Life Blue Shift...</h1>

    <div id="progress-bar">
        <div id="progress-fill"></div>
    </div>

    <div id="progress-text">0%</div>
    <div id="status-text">Checking cache...</div>
</div>

<canvas id="canvas"></canvas>

<script type="module">

const CACHE_NAME = 'bshift-zip-v2';
const CACHE_KEY = 'https://localcache/bshift.zip';
const TOTAL_PARTS = 23;

async function fetchWithProgress(url, onProgress) {

    const res = await fetch(url + "?t=" + Date.now());

    console.log(
        url,
        res.status,
        res.headers.get('content-type')
    );

    if (!res.ok) {
        throw new Error(`Failed to fetch ${url}`);
    }

    const totalBytes =
        parseInt(res.headers.get('Content-Length')) || 0;

    const reader = res.body.getReader();

    let loadedBytes = 0;

    let chunks = [];

    while (true) {

        const { done, value } = await reader.read();

        if (done) break;

        chunks.push(value);

        loadedBytes += value.length;

        if (onProgress) {
            onProgress(loadedBytes, totalBytes);
        }
    }

    const combined = new Uint8Array(loadedBytes);

    let offset = 0;

    for (const chunk of chunks) {

        combined.set(chunk, offset);

        offset += chunk.length;
    }

    return combined;
}

async function main() {

    const canvas =
        document.getElementById('canvas');

    const loadingContainer =
        document.getElementById('loading-container');

    const progressFill =
        document.getElementById('progress-fill');

    const progressText =
        document.getElementById('progress-text');

    const statusText =
        document.getElementById('status-text');

    canvas.tabIndex = 0;

    canvas.addEventListener('click', () => {
        canvas.focus();
    });

    function setProgress(pct, status) {

        progressFill.style.width = pct + '%';

        progressText.innerText =
            Math.floor(pct) + '%';

        if (status) {
            statusText.innerText = status;
        }
    }

    let zipBytes = null;

    setProgress(0, 'Checking cache...');

    try {

        const cache =
            await caches.open(CACHE_NAME);

        const cached =
            await cache.match(CACHE_KEY);

        if (cached) {

            setProgress(0, 'Loading cached ZIP...');

            zipBytes =
                new Uint8Array(
                    await cached.arrayBuffer()
                );
        }

    } catch (e) {

        console.warn(
            'Cache failed, redownloading.',
            e
        );
    }

    if (!zipBytes) {

        let loadedParts =
            new Array(TOTAL_PARTS).fill(0);

        let totalParts =
            new Array(TOTAL_PARTS).fill(0);

        function updateDownloadProgress() {

            const loaded =
                loadedParts.reduce((a, b) => a + b, 0);

            const total =
                totalParts.reduce((a, b) => a + b, 0);

            const pct =
                total > 0
                ? (loaded / total) * 50
                : 0;

            setProgress(
                pct,
                'Downloading game files...'
            );
        }

        const partPromises = [];

        for (let i = 1; i <= TOTAL_PARTS; i++) {

            const partName =
                `./bshift.zip.part${String(i).padStart(2, '0')}`;

            partPromises.push(

                fetchWithProgress(
                    partName,

                    (l, t) => {

                        loadedParts[i - 1] = l;

                        totalParts[i - 1] = t;

                        updateDownloadProgress();
                    }
                )
            );
        }

        const parts =
            await Promise.all(partPromises);

        console.log(
            "Downloaded parts:",
            parts.length
        );

        parts.forEach((p, i) => {

            console.log(
                `Part ${i + 1}:`,
                p.length,
                'bytes'
            );
        });

        const totalLength =
            parts.reduce(
                (sum, p) => sum + p.length,
                0
            );

        console.log(
            "Combined ZIP size:",
            totalLength
        );

        zipBytes =
            new Uint8Array(totalLength);

        let offset = 0;

        for (const part of parts) {

            zipBytes.set(part, offset);

            offset += part.length;
        }

        console.log(
            "ZIP signature:",
            String.fromCharCode(
                zipBytes[0],
                zipBytes[1]
            )
        );

        setProgress(50, 'Saving cache...');

        try {

            const cache =
                await caches.open(CACHE_NAME);

            await cache.put(
                CACHE_KEY,
                new Response(zipBytes, {
                    headers: {
                        'Content-Type': 'application/zip'
                    }
                })
            );

        } catch (e) {

            console.warn(
                'Cache write failed.',
                e
            );
        }
    }

    setProgress(
        50,
        'Extracting game files...'
    );

    let zip;

    try {

        zip =
            await JSZip.loadAsync(zipBytes);

    } catch (e) {

        console.error(
            'ZIP LOAD FAILED',
            e
        );

        alert(
            'ZIP extraction failed. Open console (F12) and check logs.'
        );

        return;
    }

    const fileKeys =
        Object.keys(zip.files);

    const files = {};

    for (let i = 0; i < fileKeys.length; i++) {

        const p = fileKeys[i];

        const file = zip.files[p];

        if (file.dir) continue;

        const path = `/rodir/${p}`;

        files[path] =
            await file.async("uint8array");

        const pct =
            50 +
            Math.floor(
                ((i + 1) / fileKeys.length) * 50
            );

        setProgress(
            pct,
            'Extracting game files...'
        );
    }

    setProgress(
        100,
        'Starting game...'
    );

    const extras =
        await (
            await fetch('./valve/extras.pk3')
        ).arrayBuffer();

    loadingContainer.style.display = 'none';

    canvas.style.display = 'block';

    Xash3D({

        arguments: [
            '-game',
            'bshift',
            '-windowed',
            '-console',
            '-ref',
            'webgl2'
        ],

        canvas: canvas,

        dynamicLibraries: [

            "filesystem_stdio.wasm",

            "libref_webgl2.wasm",

            "cl_dlls/menu_emscripten_wasm32.wasm",

            "dlls/bshift_emscripten_wasm32.wasm",

            "cl_dlls/client_emscripten_wasm32.wasm"
        ],

        locateFile: p => p,

        onRuntimeInitialized: function () {

            Object.keys(files).forEach(k => {

                const dir =
                    k.substring(
                        0,
                        k.lastIndexOf('/')
                    );

                this.FS.mkdirTree(dir);

                this.FS.writeFile(
                    k,
                    files[k]
                );
            });

            this.FS.writeFile(
                '/rodir/valve/extras.pk3',
                new Uint8Array(extras)
            );

            this.FS.writeFile(
                '/rodir/valve/autoexec.cfg',
`
bind "F9" "toggleconsole"
`
            );

            this.FS.chdir('/rodir');

            this.FS.mkdir('/rwdir');
        }
    });

    setTimeout(() => {
        canvas.focus();
    }, 500);
}

main();

</script>

</body>
</html>
