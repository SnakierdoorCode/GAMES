<base href="https://cdn.jsdelivr.net/gh/FusionzzzFr/Holy-Moly-Rips@main/The%20Registry/">

<script>
(function(){
  var CDN="https://cdn.jsdelivr.net/gh/FusionzzzFr/Holy-Moly-Rips@main/The%20Registry/", RAW="https://raw.githubusercontent.com/FusionzzzFr/Holy-Moly-Rips/main/The%20Registry/";
  function fixUrl(u){
    if(typeof u!=="string")return u;
    if(u.indexOf("blob:")===0||u.indexOf("data:")===0)return u;
    if(/^https?:\/\//i.test(u)){
      if(/\.(wasm|pck)(\.br)?(\?|$)/i.test(u)&&u.indexOf("jsdelivr")!==-1)
        return u.replace("https://cdn.jsdelivr.net/gh/FusionzzzFr/Holy-Moly-Rips@main/The%20Registry/", RAW);
      return u;
    }
    if(/\.(wasm|pck)(\.br)?(\?|$)/i.test(u)) return RAW+u.replace(/^\.\//,"");
    return CDN+u.replace(/^\.\//,"");
  }
  var ofetch=window.fetch;window.fetch=function(input,init){
    if(typeof input==="string")input=fixUrl(input);
    else if(input&&input.url){try{input=new Request(fixUrl(input.url),input);}catch(e){}}
    return ofetch.call(this,input,init);
  };
  var oopen=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(method,url){
    var args=[].slice.call(arguments);if(typeof url==="string")args[1]=fixUrl(url);return oopen.apply(this,args);
  };
  var OW=window.Worker;window.Worker=function(url,options){
    var src=typeof url==="string"?url:String(url);
    try{
      if(src.indexOf("blob:")===0)return new OW(src,options);
      src=fixUrl(src);
      if(src.indexOf("file:")===0){var m=src.match(/\/([^\/]+\.(js|mjs))(?:\?|$)/i);if(m)src=CDN+m[1];}
      if(/^https?:\/\//i.test(src)){
        var xhr=new XMLHttpRequest();xhr.open("GET",src,false);xhr.send(null);
        if(xhr.status>=200&&xhr.status<300&&xhr.responseText){
          return new OW(URL.createObjectURL(new Blob([xhr.responseText],{type:"application/javascript"})),options);
        }
      }
    }catch(e){console.warn("Worker patch",e);}
    return new OW(url,options);
  };
  window.Worker.prototype=OW.prototype;
})();
</script>

		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;

	max-height: 100%;

	height: 100%;
	width: 100%;

}

	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;

	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;

		<script src="https://cdn.jsdelivr.net/gh/FusionzzzFr/Holy-Moly-Rips@main/The%20Registry/index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":18287452,"index.wasm":36679550},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({threads:false});

	if (false && missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
