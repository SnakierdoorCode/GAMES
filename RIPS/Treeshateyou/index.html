<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="/TemplateData/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Trees Hate You</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    
    <style>
      /* Reset default padding and remove scrollbars */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: sans-serif;
      }

      /* Container stretches to perfectly fill the browser viewport */
      #unity-container {
        width: 100vw !important;
        height: 100vh !important;
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Canvas dynamically stretches while respecting engine aspects */
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }

      /* Keeps the loading bar centered over the dark viewport */
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        z-index: 10;
      }

      /* Hide the standard old template footer to preserve gameplay real estate */
      #unity-footer {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px; color: white;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px; color: black;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var baseBuildUrl = "Build/";

      // This is called by main.js once the chunks are stitched and ready
      window.unityRunFunction = function() {
        loadingBar.style.display = "block";

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          document.getElementsByTagName('head')[0].appendChild(meta);
          container.className = "unity-mobile";
          canvas.className = "unity-mobile";
        }

        var config = {
          arguments: [],
          dataUrl:         baseBuildUrl + "TreesHateYou_Web.data.br",
          frameworkUrl:    baseBuildUrl + "TreesHateYou_Web.framework.js.br",
          codeUrl:         baseBuildUrl + "TreesHateYou_Web.wasm.br",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "tykenn games",
          productName: "Trees Hate You",
          productVersion: "0.1.0",
          showBanner: unityShowBanner,
        };

        var script = document.createElement("script");
        script.src = baseBuildUrl + "TreesHateYou_Web.loader.js";
        script.onload = function() {
          createUnityInstance(canvas, config, function(progress) {
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          }).then(function(unityInstance) {
            loadingBar.style.display = "none";
            
            // DYNAMIC RESIZE HANDLER: Forces WebGL framework context update on window changes
            function resizeCanvas() {
              canvas.style.width = window.innerWidth + "px";
              canvas.style.height = window.innerHeight + "px";
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas(); // Initialize on launch
            
          }).catch(function(message) {
            alert(message);
          });
        };
        script.onerror = function() {
          unityShowBanner("Failed to load Unity loader script.", "error");
        };
        document.body.appendChild(script);
      };
    </script>

    <script src="main.js"></script>
  </body>
</html>
