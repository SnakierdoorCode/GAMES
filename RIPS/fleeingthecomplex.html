<!DOCTYPE html>
<html style="width:100%;height:100%;margin:0;background:#000;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fleeing The Complex</title>
<style>
  html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#000; }
  #game { width:100%; height:100%; display:block; border:0; }
</style>
</head>
<body>
<div id="game"></div>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay: "on",
  unmuteOverlay: "hidden",
  letterbox: "on",
  scale: "showAll",
  forceAlign: true,
  forceScale: true,
  splashScreen: false
};
window.addEventListener("load", function() {
  var ruffle = window.RufflePlayer.newest();
  var player = ruffle.createPlayer();
  player.style.width = "100%";
  player.style.height = "100%";
  document.getElementById("game").appendChild(player);
  player.load("https://raw.githubusercontent.com/FusionzzzFr/Holy-Moly-Rips/main/Henry%20Stickman/Fleeing%20The%20Complex/665992_complex.swf");
});
</script>
</body>
</html>
