<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Quest - Fullscreen</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
    </style>
</head>
<body>

    <div class="GameContainer" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden;">
        <iframe 
            id="game-iframe" 
            src="https://www.crazygames.com/embed/drive-quest---car-game" 
            title="Drive Quest" 
            scrolling="no" 
            allow="autoplay; payment; fullscreen; microphone; focus-without-user-activation *; screen-wake-lock; gamepad; clipboard-read; clipboard-write; accelerometer; gyroscope; keyboard-map;" 
            allowfullscreen="yes" 
            sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-presentation allow-scripts allow-same-origin allow-downloads allow-popups allow-popups-to-escape-sandbox" 
            loading="eager" 
            importance="high" 
            style="border: 0px; margin: 0px; padding: 0px; width: 100%; height: 100%; position: absolute; top: 0px; left: 0px; user-select: none; display: block;">
        </iframe>
    </div>

</body>
</html>
