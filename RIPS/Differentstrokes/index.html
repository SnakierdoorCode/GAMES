<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Different Strokes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/Differentstrokes/TemplateData/style.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
      }

      #unity-container {
        width: 100% !important;
        height: 100% !important;
        position: absolute;
        top: 0;
        left: 0;
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain;
        display: block;
      }

      #unity-footer {
        display: none !important;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
      }

      .watermark {
        position: fixed;
        bottom: 10px;
        right: 15px;
        color: rgba(255, 255, 255, 0.9); 
        font-family: 'Courier New', Courier, monospace;
        font-size: 12px;
        pointer-events: none;
        z-index: 9999;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/Differentstrokes/main.js"> </script>
    <div class="watermark">Ripped by Musashi - Check out The Universal Stash</div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button"></div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      canvas.addEventListener("click", () => {
        if (!document.pointerLockElement && canvas.requestPointerLock) {
          canvas.requestPointerLock();
        }
      });

      // --- REMOTE GITHUB ASSET CONFIGURATION ---
      // Direct CDN url referencing your repository structure
      const BASE_URL = "https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/Differentstrokes/Build"; 

      const CHUNKS = {
        data: {
          count: 2,
          pattern: (i) => `${BASE_URL}/DifferentStrokesWeb.data.unityweb.part${i}`
        },
        wasm: {
          count: 3,
          pattern: (i) => `${BASE_URL}/DifferentStrokesWeb.wasm.unityweb.part${i}`
        }
      };

      async function reconstructFile(chunkConfig) {
        const promises = [];
        for (let i = 1; i <= chunkConfig.count; i++) {
          const url = chunkConfig.pattern(i);
          promises.push(fetch(url).then(res => {
            if (!res.ok) throw new Error(`Failed to load chunk: ${url}`);
            return res.arrayBuffer();
          }));
        }
        
        const buffers = await Promise.all(promises);
        const blob = new Blob(buffers, { type: "application/octet-stream" });
        return URL.createObjectURL(blob);
      }

      // Using raw.githack for framework execution to keep Unity compiler's MIME check satisfied
      var githackUrl = "https://raw.githack.com/SnakierdoorCode/GAMES/main/RIPS/Differentstrokes/Build";
      var loaderUrl = githackUrl + "/DifferentStrokesWeb.loader.js";
      
      var config = {
        arguments: [],
        frameworkUrl: githackUrl + "/DifferentStrokesWeb.framework.js.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Different Folks",
        productName: "Different Strokes",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        config.devicePixelRatio = 1;
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        config.devicePixelRatio = 1;
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      async function initGame() {
        try {
          const [dataUrl, wasmUrl] = await Promise.all([
            reconstructFile(CHUNKS.data),
            reconstructFile(CHUNKS.wasm)
          ]);

          config.dataUrl = dataUrl;
          config.codeUrl = wasmUrl;

          var script = document.createElement("script");
          script.src = loaderUrl;
          script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
              document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
            }).then((unityInstance) => {
              document.querySelector("#unity-loading-bar").style.display = "none";
            }).catch((message) => {
              alert(message);
            });
          };
          document.body.appendChild(script);

        } catch (error) {
          unityShowBanner(`Failed to initialize files: ${error.message}`, 'error');
          console.error(error);
        }
      }

      initGame();
    console.log("Ripped by musashi on The Universal Stash")
    </script>
  </body>
</html>
