    <script>
        const CDN_BASE = 'https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/DriveZone/';

        const originalFetch = window.fetch;
        window.fetch = function(input, init) {
            if (typeof input === 'string') {
                if (!input.startsWith('http://') && !input.startsWith('https://') && !input.startsWith('blob:')) {
                    // Extract path relative to RIPS/DriveZone
                    const cleanPath = input.replace(/^(\.\/|\/|file:\/\/\/.*?\/Build\/|file:\/\/\/.*?\/)/, '');
                    if (cleanPath.startsWith('Build/')) {
                        input = CDN_BASE + cleanPath;
                    } else if (cleanPath.endsWith('.part1') || cleanPath.endsWith('.part2')) {
                        input = CDN_BASE + 'Build/' + cleanPath;
                    } else {
                        input = CDN_BASE + cleanPath;
                    }
                }
            }
            return originalFetch.call(this, input, init);
        };

        const originalCreateElement = document.createElement;
        document.createElement = function(tagName, options) {
            const element = originalCreateElement.call(document, tagName, options);
            if (tagName.toLowerCase() === 'script') {
                const redirectUrl = function(url) {
                    if (!url || url.startsWith('http://') || url.startsWith('https://') || url.startsWith('blob:')) return url;
                    const filename = url.split('/').pop();
                    if (filename.endsWith('.loader.js')) {
                        return CDN_BASE + 'Build/' + filename;
                    }
                    return CDN_BASE + filename;
                };

                const originalSetAttribute = element.setAttribute;
                element.setAttribute = function(name, value) {
                    if (name === 'src') value = redirectUrl(value);
                    return originalSetAttribute.call(this, name, value);
                };

                Object.defineProperty(element, 'src', {
                    set: function(url) {
                        element.setAttribute('src', redirectUrl(url));
                    },
                    get: function() {
                        return element.getAttribute('src');
                    }
                });
            }
            return element;
        };
    </script>

<body>
    <canvas id="canvas" class="fullscreen-canvas"></canvas>

    <script>
        async function loadCombinedDataUrl(parts) {
            const buffers = await Promise.all(
                parts.map(url => fetch(url).then(res => {
                    if (!res.ok) throw new Error(`Failed to load ${url}: ${res.statusText}`);
                    return res.arrayBuffer();
                }))
            );

            const totalLength = buffers.reduce((acc, buf) => acc + buf.byteLength, 0);
            const combinedArray = new Uint8Array(totalLength);
            let offset = 0;
            for (const buffer of buffers) {
                combinedArray.set(new Uint8Array(buffer), offset);
                offset += buffer.byteLength;
            }

            const blob = new Blob([combinedArray], { type: 'application/octet-stream' });
            return URL.createObjectURL(blob);
        }

        const dataParts = [
            'https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/DriveZone/Build/67d21dd6ddd827425bdc245f02f12be6.data.unityweb.part1',
            'https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/DriveZone/Build/67d21dd6ddd827425bdc245f02f12be6.data.unityweb.part2'
        ];

        window.combinedDataUrlPromise = loadCombinedDataUrl(dataParts);
    </script>
