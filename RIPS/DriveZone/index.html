    <script nonce="Jq-JXDUhlvAfM7fmDpariw">
        // Helper function to download and combine split files into a Blob URL
        async function loadCombinedDataUrl(parts) {
            const buffers = await Promise.all(
                parts.map(url => fetch(url).then(res => {
                    if (!res.ok) throw new Error(`Failed to load ${url}: ${res.statusText}`);
                    return res.arrayBuffer();
                }))
            );

            // Calculate total size
            const totalLength = buffers.reduce((acc, buf) => acc + buf.byteLength, 0);

            // Merge array buffers into a single Uint8Array
            const combinedArray = new Uint8Array(totalLength);
            let offset = 0;
            for (const buffer of buffers) {
                combinedArray.set(new Uint8Array(buffer), offset);
                offset += buffer.byteLength;
            }

            // Create a Blob and generate an Object URL
            const blob = new Blob([combinedArray], { type: 'application/octet-stream' });
            return URL.createObjectURL(blob);
        }

        // List your split parts here in correct sequence
        const dataParts = [
            '/Build/67d21dd6ddd827425bdc245f02f12be6.data.unityweb.part1',
            '/Build/67d21dd6ddd827425bdc245f02f12be6.data.unityweb.part2'
        ];

        // Combine parts before initializing Unity loader / Playgama Bridge
        window.combinedDataUrlPromise = loadCombinedDataUrl(dataParts);
    </script>
