<!DOCTYPE html>
<html style="width:100%;height:100%;margin:0;background:#000;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vex 1</title>
<style>html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000;}#game{width:100%;height:100%;}</style>
</head>
<body>
<div id="game"></div>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = { autoplay:"on", unmuteOverlay:"hidden", letterbox:"on", scale:"showAll", forceAlign:true, forceScale:true, splashScreen:false };
window.addEventListener("load", function() {
  var r = window.RufflePlayer.newest();
  var p = r.createPlayer();
  p.style.width = p.style.height = "100%";
  document.getElementById("game").appendChild(p);
  p.load("https://raw.githubusercontent.com/FusionzzzFr/Holy-Moly-Rips/main/Vex/Vex%201/game.swf");
});
</script>
</body>
</html>
